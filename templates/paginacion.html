{% if page_obj.has_other_pages %}<nav class="action-group mt-3" aria-label="Páginas">{% if page_obj.has_previous %}<a class="btn btn-outline-secondary" href="?page={{ page_obj.previous_page_number }}&amp;q={{ busqueda|urlencode }}">Anterior</a>{% endif %}<span>{{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="btn btn-outline-secondary" href="?page={{ page_obj.next_page_number }}&amp;q={{ busqueda|urlencode }}">Siguiente</a>{% endif %}</nav>{% endif %}
