<div class="mb-3">
{% if field.field.widget.input_type == 'checkbox' %}
<div class="form-check">{{ field }}<label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label></div>
{% else %}
<label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
{% endif %}
{{ field.errors }}
{% if field.help_text %}<p class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
</div>
